syntax = "proto3";

package remote;

message RemoteMessage {
  oneof message {
    RemoteConfigure remote_configure = 1;
    RemoteSetActive remote_set_active = 2;
    RemoteError remote_error = 3;
    RemotePingRequest remote_ping_request = 8;
    RemotePingResponse remote_ping_response = 9;
    RemoteKeyInject remote_key_inject = 10;
    RemoteImeKeyInject remote_ime_key_inject = 20;
    RemoteImeBatchEdit remote_ime_batch_edit = 21;
    RemoteImeShowRequest remote_ime_show_request = 22;
    RemoteVoiceBegin remote_voice_begin = 30;
    RemoteVoicePayload remote_voice_payload = 31;
    RemoteVoiceEnd remote_voice_end = 32;
    RemoteStart remote_start = 40;
    RemoteSetVolumeLevel remote_set_volume_level = 50;
    RemoteAdjustVolumeLevel remote_adjust_volume_level = 51;
    RemoteSetPreferredAudioDevice remote_set_preferred_audio_device = 60;
    RemoteResetPreferredAudioDevice remote_reset_preferred_audio_device = 61;
    RemoteAppLinkLaunchRequest android_tv_remote_link_launch_request = 90;

  }
}
message RemoteKeyInject {
  enum RemoteKeyCode {
    KEYCODE_UNKNOWN = 0;

  // navigation
    KEYCODE_DPAD_UP = 19;
    KEYCODE_DPAD_DOWN = 20;
    KEYCODE_DPAD_LEFT = 21;
    KEYCODE_DPAD_RIGHT = 22;
    KEYCODE_DPAD_CENTER = 23;
    KEYCODE_BACK = 4;
    KEYCODE_HOME = 3;
    KEYCODE_MENU = 82;
    KEYCODE_GUIDE = 172;
    KEYCODE_INFO = 165;
    KEYCODE_SETTINGS = 176;

  // media
    KEYCODE_MEDIA_PLAY = 126;
    KEYCODE_MEDIA_PAUSE = 127;
    KEYCODE_MEDIA_PLAY_PAUSE = 85;
    KEYCODE_MEDIA_STOP = 86;
    KEYCODE_MEDIA_NEXT = 87;
    KEYCODE_MEDIA_PREVIOUS = 88;
    KEYCODE_MEDIA_REWIND = 89;
    KEYCODE_MEDIA_FAST_FORWARD = 90;
    KEYCODE_MEDIA_RECORD = 130;
    KEYCODE_SEARCH          = 84;
  // volume
    KEYCODE_VOLUME_UP = 24;
    KEYCODE_VOLUME_DOWN = 25;
    KEYCODE_MUTE = 91;

  // tv_specific
    KEYCODE_TV = 170;
    KEYCODE_TV_POWER = 177;
    KEYCODE_TV_INPUT = 178;
    KEYCODE_CHANNEL_UP = 166;
    KEYCODE_CHANNEL_DOWN = 167;
    KEYCODE_TV_RADIO_SERVICE = 232;
    KEYCODE_TV_DATA_SERVICE = 230;
    KEYCODE_TV_TELETEXT = 233;
    KEYCODE_TV_NETWORK = 241;
    KEYCODE_TV_SATELLITE = 237;
    KEYCODE_TV_ANTENNA_CABLE = 238;

  // system
    KEYCODE_POWER = 26;
    KEYCODE_SLEEP = 223;
    KEYCODE_WAKEUP = 224;
    KEYCODE_APP_SWITCH = 187;
    KEYCODE_ASSIST = 219;
    KEYCODE_VOICE_ASSIST = 231;
    KEYCODE_TV_INPUT_HDMI_1 = 243;
    KEYCODE_TV_INPUT_HDMI_2 = 244;
    KEYCODE_TV_INPUT_HDMI_3 = 245;
    KEYCODE_TV_INPUT_HDMI_4 = 246;
    KEYCODE_TV_INPUT_COMPONENT_1 = 249;
    KEYCODE_TV_INPUT_COMPOSITE_1 = 247;

  // numeric
    KEYCODE_0 = 7;
    KEYCODE_1 = 8;
    KEYCODE_2 = 9;
    KEYCODE_3 = 10;
    KEYCODE_4 = 11;
    KEYCODE_5 = 12;
    KEYCODE_6 = 13;
    KEYCODE_7 = 14;
    KEYCODE_8 = 15;
    KEYCODE_9 = 16;

  // misc
    KEYCODE_ENTER = 66;
    KEYCODE_DEL = 67;
    KEYCODE_SPACE = 62;
    KEYCODE_PAGE_UP = 92;
    KEYCODE_PAGE_DOWN = 93;
    KEYCODE_PROG_RED = 183;
    KEYCODE_PROG_GREEN = 184;
    KEYCODE_PROG_YELLOW = 185;
    KEYCODE_PROG_BLUE = 186;
  }

  RemoteKeyCode key_code = 1;
  RemoteDirection direction = 2;
}
message RemoteAppLinkLaunchRequest {
  string app_link = 1;
}
message RemoteVoicePayload {
  int32 session_id = 1;
  bytes samples = 2;
}

message RemoteVoiceBegin {
  int32 session_id = 1;
  // Package name is sent from the Android device as a response to sending KEYCODE_SEARCH and not required when sending audio.
  string package_name = 2;
}
message RemoteVoiceEnd {
  int32 session_id = 1;
}
// Configuration messages
message RemoteConfigure {
  uint32 code1 = 1;  // Usually 622 (which is varint for: 8, 238, 4)
  RemoteDeviceInfo device_info = 2;
}
message RemoteStart {
  bool started = 1;
}
message RemoteDeviceInfo {
  string model = 1;
  string vendor = 2;
  int32 unknown1 = 3;
  string unknown2 = 4;
  string package_name = 5;
  string app_version = 6;
}
message RemoteVolumeInfo {
  int32 audio_device_id = 1;
  int32 max_volume = 2;
  string device_name = 3;
  int32 current_volume = 4;
  bool is_muted = 5;
  int32 volume_step = 6;
  int32 unknown1 = 7;
  bool unknown2 = 8;
}
message RemoteImeShowRequest {
  RemoteTextFieldStatus remote_text_field_status = 2;
}
message RemotePowerInfo {
  bool is_on = 1;
}
message RemoteSetActive {
  uint32 active = 1;  // Usually 622
}
message RemoteTextFieldStatus {
  int32 counter_field = 1;
  string value = 2;
  int32 start = 3;
  int32 end = 4;
  int32 int5 = 5;
  string label = 6;
}

message RemoteImeKeyInject {
  string text_field = 1;
  uint32 key_code = 2;
  RemoteDirection direction = 3;
}

enum RemoteDirection {
  REMOTE_DIRECTION_UNKNOWN = 0;
  PRESSED = 1;          // Key press down
  RELEASED = 2;         // Key release up
  SHORT_PRESS = 3;      // Complete press and release
}


message RemoteImeBatchEdit {
  int32 ime_counter = 1;
  int32 field_counter = 2;
  repeated RemoteEditInfo edit_info = 3;
}

message RemoteEditInfo {
  uint32 insert = 1;
  RemoteImeObject text_field_status = 2;
}


message RemoteImeObject {
  int32 start = 1;
  int32 end = 2;
  string value = 3;
}

message RemoteAppInfo {
  int32 counter = 1;
  int32 int2 = 2;
  int32 int3 = 3;
  string int4 = 4;
  int32 int7 = 7;
  int32 int8 = 8;
  string label = 10;
  string app_package = 12;
  int32 int13 = 13;
}

message RemotePingRequest {
  int32 val1 = 1;
  int32 val2 = 2;
}

message RemotePingResponse {
  int32 val1 = 1;
  int32 val2 = 2;
}

// Power status
message RemoteGetPowerStatus {}

message RemotePowerStatus {
  bool is_powered_on = 1;
}

// Volume control
message RemoteSetVolumeLevel {
   uint32 unknown1 = 1;
  uint32 unknown2 = 2;
  string player_model = 3;
  uint32 unknown4 = 4;
  uint32 unknown5 = 5;
  uint32 volume_max = 6;
  uint32 volume_level = 7;
  bool volume_muted = 8;
}

message RemoteAdjustVolumeLevel {
  RemoteVolumeDirection direction = 1;
}

enum RemoteVolumeDirection {
  VOLUME_DIRECTION_UNKNOWN = 0;
  VOLUME_UP = 1;
  VOLUME_DOWN = 2;
}

message RemoteSetPreferredAudioDevice {
  string device_id = 1;
}

message RemoteResetPreferredAudioDevice {}

// Error handling
message RemoteError {
  uint32 error_code = 1;
  string error_message = 2;
}