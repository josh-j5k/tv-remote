syntax = "proto3";

package pairing;

message OuterMessage {
  uint32 protocol_version = 1;  // Tag 8
  uint32 status = 2;             // Tag 16
  
  oneof message {
    PairingRequest pairing_request = 10;           // Tag 82 = (10<<3)|2
    PairingResponse pairing_response = 11;         // Tag 90 = (11<<3)|2
    PairingRequestAck pairing_request_ack = 13;    // Tag 106 = (13<<3)|2
    PairingOptions pairing_option = 20;            // Tag 162,1 = field 20
    PairingOptionsAck pairing_option_ack = 21;     // Tag 170,1 = field 21
    PairingConfiguration pairing_configuration = 30; // Tag 242,1 = field 30
    PairingConfigurationAck pairing_configuration_ack = 31; // Tag 250,1 = field 31
    PairingSecret pairing_secret = 40; 
    PairingSecretAck pairing_secret_ack = 41;
    ErrorMessage error = 200;
  }
}

message PairingRequest {
  string service_name = 1;   // Tag 10
  string client_name = 2;    // Tag 18
  string client_id = 3;
  string service_uuid = 4;
}

message PairingRequestAck {}

message PairingResponse {
  int32 status = 1;
  bytes server_certificate = 2;
}

message PairingSecret {
  bytes secret = 1;  // Tag 10
}

message SecretResponse {
  uint32 status = 1;
}

message ErrorMessage {
  uint32 error_code = 1;
  string error_message = 2;
}

enum KeyExchange {
  KEY_EXCHANGE_UNKNOWN = 0;
  ECDH_P256 = 1;
  X25519 = 2;
}

enum SecretExchange {
  SECRET_EXCHANGE_UNKNOWN = 0;
  HMAC_SHA256 = 1;
}

message PairingConfiguration {
  Encoding encoding = 1;        // The CHOSEN encoding from Options negotiation
  RoleType client_role = 2;
}

message PairingConfigurationAck {}

message PairingSecretAck {
  bytes secret = 1;  // The encoded secret from pairing
}
message Encoding {
  enum EncodingType {
    ENCODING_TYPE_UNKNOWN = 0;
    ENCODING_TYPE_ALPHANUMERIC = 1;
    ENCODING_TYPE_NUMERIC = 2;
    ENCODING_TYPE_HEXADECIMAL = 3;
    ENCODING_TYPE_QRCODE = 4;
  }
  
  EncodingType type = 1;   // Tag 8
  uint32 symbol_length = 2; // Tag 16
}

enum RoleType {
  ROLE_TYPE_UNKNOWN = 0;
  ROLE_TYPE_INPUT = 1;
  ROLE_TYPE_OUTPUT = 2;
}

message PairingOptions {
  repeated Encoding input_encodings = 1;   // Tag 10
  repeated Encoding output_encodings = 2;  // Tag 18
  RoleType preferred_role = 3;             // Tag 24
  //repeated KeyExchange preferred_key_exchanges = 4;
  //repeated SecretExchange preferred_secret_exchanges = 5;
}

message PairingOptionsAck {
  Encoding selected_input_encoding = 1;
  Encoding selected_output_encoding = 2;
  RoleType selected_role = 3;
}