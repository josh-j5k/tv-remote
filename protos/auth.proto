syntax = "proto3";

package pairing;

message OuterMessage {
  uint32 protocol_version = 1;
  uint32 status = 2;

  oneof message {
    PairingRequest pairing_request = 10;
    PairingResponse pairing_response = 11;
    PairingSecret pairing_secret = 12;
    PairingRequestAck pairing_request_ack = 13;
    Options pairing_option = 14;
    OptionsAck pairing_option_ack = 15;
    Configuration pairing_configuration = 16;
    ConfigurationAck pairing_configuration_ack = 17;
  }
}

// PHASE 1
message PairingRequest {
  string client_name  = 1;
  string service_name = 2;
  string client_id    = 3;
  string service_uuid = 4;
}

message PairingRequestAck {}

message PairingResponse {
  int32 status = 1;
  string server_public_key = 2;
}

message PairingSecret {
  bytes encrypted_secret = 1;
}
message PairingSecretAck {}

message Encoding {
  enum EncodingType {
    ENCODING_TYPE_UNKNOWN = 0;
    ENCODING_TYPE_ALPHANUMERIC = 1;
    ENCODING_TYPE_NUMERIC = 2;
    ENCODING_TYPE_HEXADECIMAL = 3;
    ENCODING_TYPE_QRCODE = 4;
  }

  EncodingType type = 1;
  uint32 symbol_length = 2;
}

message Options {
  enum RoleType {
    ROLE_TYPE_UNKNOWN = 0;
    ROLE_TYPE_INPUT = 1;
    ROLE_TYPE_OUTPUT = 2;
  }

  repeated Encoding input_encodings = 1;
  repeated Encoding output_encodings = 2;
  RoleType preferred_role = 3;
}

message OptionsAck {}

message Configuration {
  Encoding encoding = 1;
  Options.RoleType client_role = 2;
}

message ConfigurationAck {}
